name: Install and test MQTT.js

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 3 * * 2'

permissions:
  contents: read

# A newer push to a pull request cancels the run of its older commit. A run on main or on the schedule gets a group of
# its own, so it always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The main ruleset requires checks (ubuntu-26.04) and checks (windows-latest). Each job installs once and runs every
  # check as a step of its own. A check runs after an earlier check failed, and it starts from a tree without the
  # files an earlier check wrote. Keep this job free of a job-level `if`. GitHub counts a skipped required job as
  # passing.
  verify:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    outputs:
      Linux: ${{ steps.failed.outputs.Linux }}
      Windows: ${{ steps.failed.outputs.Windows }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - id: install
        run: pnpm install --frozen-lockfile
      - name: test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git clean -fdxq -e node_modules && pnpm test
      - name: test:types
        id: test-types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git clean -fdxq -e node_modules && pnpm test:types
      # Lint reads emitted declarations. Emitting them without a type check keeps a type error in the test:types check only.
      - name: lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git clean -fdxq -e node_modules && pnpm lint:declarations && pnpm lint
      - name: format:check
        id: format-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git clean -fdxq -e node_modules && pnpm format:check
      - name: build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git clean -fdxq -e node_modules && pnpm build
      - name: Name the failed checks
        id: failed
        if: ${{ failure() }}
        shell: bash
        env:
          OUTCOMES: >-
            test=${{ steps.test.outcome }}
            test:types=${{ steps.test-types.outcome }}
            lint=${{ steps.lint.outcome }}
            format:check=${{ steps.format-check.outcome }}
            build=${{ steps.build.outcome }}
        run: |
          failed=()
          for outcome in $OUTCOMES; do
            if [[ $outcome == *=failure ]]; then
              failed+=("\"${outcome%=*} (${{ matrix.os }})\"")
            fi
          done
          (IFS=,; echo "${{ runner.os }}=${failed[*]}") >> "$GITHUB_OUTPUT"

  # A failed check also reports as a status that names it, such as failed-check (lint (windows-latest)), so a pull
  # request shows which check failed. A run without a failed check skips this job and starts no runner for it. The
  # job has no `name`, because GitHub shows a skipped matrix job under its unexpanded name.
  failed-check:
    needs: verify
    if: ${{ failure() && (needs.verify.outputs.Linux || needs.verify.outputs.Windows) }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(format('[{0}{1}{2}]', needs.verify.outputs.Linux, needs.verify.outputs.Linux && needs.verify.outputs.Windows && ',' || '', needs.verify.outputs.Windows)) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Point to the output of the failed check
        run: |
          echo "::error title=${{ matrix.check }}::This check failed. Its output is in the step of the same name in the checks job of that platform."
          exit 1

  packed-consumer:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack the candidate
        run: |
          mkdir -p "$RUNNER_TEMP/mqtt-artifact"
          pnpm pack --pack-destination "$RUNNER_TEMP/mqtt-artifact"
      - uses: actions/upload-artifact@v7
        with:
          name: mqtt-tarball
          path: ${{ runner.temp }}/mqtt-artifact/*.tgz
          if-no-files-found: error
      - name: Install the tarball and check public declarations
        run: |
          consumer="$RUNNER_TEMP/mqtt-consumer"
          mkdir "$consumer"
          cp test/packed/{consumer.ts,tsconfig.json,browser.mjs,broker.mjs,custom-transport.mjs,first-connection-recovery.mjs,native-websocket.mjs,publish-properties.mjs,reconnect.mjs,server-keep-alive.mjs,session-resume.mjs,websocket-browser.mjs,tcp-only-check.mjs,will.mjs,will-scenario.mjs} "$consumer/"
          printf '{"private":true,"type":"module"}\n' > "$consumer/package.json"
          npm install --prefix "$consumer" --engine-strict --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/mqtt-artifact/*.tgz "@types/node@$(node -p "require('./package.json').devDependencies['@types/node']")"
          (cd "$consumer" && node tcp-only-check.mjs) | tee -a "$GITHUB_STEP_SUMMARY"
          (cd "$consumer" && node server-keep-alive.mjs) | tee -a "$GITHUB_STEP_SUMMARY"
          npm install --prefix "$consumer" --engine-strict --ignore-scripts --no-audit --no-fund "ws@$(node -p "require('./package.json').devDependencies.ws")"
          pnpm exec tsc -p "$consumer/tsconfig.json"
          (cd "$consumer" && node --input-type=module -e 'import * as root from "mqtt"; import { createWebSocketClient } from "mqtt/ws"; if (typeof createWebSocketClient !== "function" || "connect" in root) process.exit(1);')
      - name: Run the MQTT 5 echo against Mosquitto
        run: |
          timeout 180 bash test/packed/mosquitto-container.sh --pull
          broker_dir="$RUNNER_TEMP/mqtt-broker"
          mkdir -p "$broker_dir"
          cp test/packed/mosquitto.conf "$broker_dir/mqtt-ci.conf"
          MQTT_BROKER_DIR="$broker_dir" bash test/packed/mosquitto-container.sh -c "$broker_dir/mqtt-ci.conf" &
          broker=$!
          trap 'kill "$broker" 2>/dev/null || true' EXIT
          timeout 10 bash -c 'until ( : > /dev/tcp/127.0.0.1/18883 ) 2>/dev/null; do sleep 0.2; done'
          MQTT_TEST_PORT=18883 MQTT_TEST_ITERATIONS=100 timeout 30 node "$RUNNER_TEMP/mqtt-consumer/broker.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
          MQTT_TEST_PORT=18883 timeout 15 node "$RUNNER_TEMP/mqtt-consumer/custom-transport.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
          MQTT_PORT=18883 timeout 30 node test/packed/quickstart-check.ts "$RUNNER_TEMP/mqtt-consumer" | tee -a "$GITHUB_STEP_SUMMARY"
          timeout 15 node "$RUNNER_TEMP/mqtt-consumer/first-connection-recovery.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
          MQTT_TEST_PORT=18883 timeout 20 node "$RUNNER_TEMP/mqtt-consumer/will.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
          MQTT_TEST_PORT=18883 timeout 20 node "$RUNNER_TEMP/mqtt-consumer/publish-properties.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
          MQTT_TEST_PORT=18883 timeout 20 node "$RUNNER_TEMP/mqtt-consumer/reconnect.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
          MQTT_TEST_PORT=18883 timeout 20 node "$RUNNER_TEMP/mqtt-consumer/session-resume.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Bundle the portable browser import
        if: github.event_name != 'schedule'
        run: node test/packed/browser-build.mjs "$RUNNER_TEMP/mqtt-consumer" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the packed WebSocket browser graph
        run: node test/packed/websocket-check.mjs "$RUNNER_TEMP/mqtt-consumer" --bundle-only
      - name: Install scheduled browser test engines
        if: github.event_name == 'schedule'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run the scheduled browser matrix
        if: github.event_name == 'schedule'
        run: node test/packed/browser-build.mjs "$RUNNER_TEMP/mqtt-consumer" chromium firefox webkit | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare packed native WebSocket in Node and Chromium
        if: github.event_name == 'schedule'
        run: timeout 30 node test/packed/websocket-check.mjs "$RUNNER_TEMP/mqtt-consumer"

      - name: Run packed MQTT 5 sessions over WS and WSS
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            sudo apt-get update
            sudo apt-get install -y libnss3-tools
            export MQTT_TEST_CHROMIUM=1
          fi
          MOSQUITTO_BIN="$GITHUB_WORKSPACE/test/packed/mosquitto-container.sh" MQTT_BROKER_DIR="$RUNNER_TEMP/mqtt-broker" bash test/packed/mosquitto-ws.sh "$RUNNER_TEMP/mqtt-consumer"
