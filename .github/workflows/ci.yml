name: Install and test MQTT.js

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.check }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
        check: [test, 'test:types', lint, 'format:check', build]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      # Lint reads emitted declarations. Emitting them without a type check keeps a type error in the test:types check only.
      - if: matrix.check == 'lint'
        run: pnpm lint:declarations
      - run: pnpm ${{ matrix.check }}

  # The main ruleset requires checks (ubuntu-26.04) and checks (windows-latest). Each fails unless every verify job passed
  # on both platforms. It runs even after a cancel, because GitHub counts a skipped required job as passing.
  checks:
    if: ${{ always() }}
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every check on both platforms
        run: test "${{ needs.verify.result }}" = success

  packed-consumer:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack the candidate
        run: |
          mkdir -p "$RUNNER_TEMP/mqtt-artifact"
          pnpm pack --pack-destination "$RUNNER_TEMP/mqtt-artifact"
      - uses: actions/upload-artifact@v7
        with:
          name: mqtt-tarball
          path: ${{ runner.temp }}/mqtt-artifact/*.tgz
          if-no-files-found: error
      - name: Install the tarball and check public declarations
        run: |
          consumer="$RUNNER_TEMP/mqtt-consumer"
          mkdir "$consumer"
          cp test/packed/{consumer.ts,tsconfig.json,browser.mjs,broker.mjs,custom-transport.mjs,first-connection-recovery.mjs,native-websocket.mjs,publish-properties.mjs,reconnect.mjs,server-keep-alive.mjs,session-resume.mjs,websocket-browser.mjs,tcp-only-check.mjs,will.mjs,will-scenario.mjs} "$consumer/"
          printf '{"private":true,"type":"module"}\n' > "$consumer/package.json"
          npm install --prefix "$consumer" --engine-strict --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/mqtt-artifact/*.tgz "@types/node@$(node -p "require('./package.json').devDependencies['@types/node']")"
          (cd "$consumer" && node tcp-only-check.mjs) | tee -a "$GITHUB_STEP_SUMMARY"
          (cd "$consumer" && node server-keep-alive.mjs) | tee -a "$GITHUB_STEP_SUMMARY"
          npm install --prefix "$consumer" --engine-strict --ignore-scripts --no-audit --no-fund "ws@$(node -p "require('./package.json').devDependencies.ws")"
          pnpm exec tsc -p "$consumer/tsconfig.json"
          (cd "$consumer" && node --input-type=module -e 'import * as root from "mqtt"; import { createWebSocketClient } from "mqtt/ws"; if (typeof createWebSocketClient !== "function" || "connect" in root) process.exit(1);')
      - name: Run the MQTT 5 echo against Mosquitto
        run: |
          timeout 180 bash test/packed/mosquitto-container.sh --pull
          broker_dir="$RUNNER_TEMP/mqtt-broker"
          mkdir -p "$broker_dir"
          cp test/packed/mosquitto.conf "$broker_dir/mqtt-ci.conf"
          MQTT_BROKER_DIR="$broker_dir" bash test/packed/mosquitto-container.sh -c "$broker_dir/mqtt-ci.conf" &
          broker=$!
          trap 'kill "$broker" 2>/dev/null || true' EXIT
          timeout 10 bash -c 'until ( : > /dev/tcp/127.0.0.1/18883 ) 2>/dev/null; do sleep 0.2; done'
          MQTT_TEST_PORT=18883 MQTT_TEST_ITERATIONS=100 timeout 30 node "$RUNNER_TEMP/mqtt-consumer/broker.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
          MQTT_TEST_PORT=18883 timeout 15 node "$RUNNER_TEMP/mqtt-consumer/custom-transport.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
          MQTT_PORT=18883 timeout 30 node test/packed/quickstart-check.ts "$RUNNER_TEMP/mqtt-consumer" | tee -a "$GITHUB_STEP_SUMMARY"
          timeout 15 node "$RUNNER_TEMP/mqtt-consumer/first-connection-recovery.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
          MQTT_TEST_PORT=18883 timeout 20 node "$RUNNER_TEMP/mqtt-consumer/will.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
          MQTT_TEST_PORT=18883 timeout 20 node "$RUNNER_TEMP/mqtt-consumer/publish-properties.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
          MQTT_TEST_PORT=18883 timeout 20 node "$RUNNER_TEMP/mqtt-consumer/reconnect.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
          MQTT_TEST_PORT=18883 timeout 20 node "$RUNNER_TEMP/mqtt-consumer/session-resume.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Bundle the portable browser import
        run: node test/packed/browser-build.mjs "$RUNNER_TEMP/mqtt-consumer" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the packed WebSocket browser graph
        run: node test/packed/websocket-check.mjs "$RUNNER_TEMP/mqtt-consumer" --bundle-only
      - name: Run packed MQTT 5 sessions over WS and WSS
        run: MOSQUITTO_BIN="$GITHUB_WORKSPACE/test/packed/mosquitto-container.sh" MQTT_BROKER_DIR="$RUNNER_TEMP/mqtt-broker" bash test/packed/mosquitto-ws.sh "$RUNNER_TEMP/mqtt-consumer"

  # The browser checks download a browser each, so a pull request runs them only when it changes a file below. The
  # schedule and a manual run always run them. A push to main does not, because its pull request already did.
  browser-changes:
    runs-on: ubuntu-26.04
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: changed
        shell: bash
        run: |
          run=true
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            run=false
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # The checkout of a pull request is its merge commit, whose first parent is the base.
            if git diff --quiet HEAD^1 HEAD -- .github/workflows/ci.yml src/browser.ts src/browserClient.ts \
              src/pageLifecycle.ts src/reconnect.ts 'test/packed/page-lifecycle*' 'test/packed/browser-build.*' \
              'test/packed/websocket-check.*' 'test/packed/websocket-session*' test/packed/mosquitto-ws.sh; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  browsers:
    name: browsers (${{ matrix.browser }})
    needs: browser-changes
    if: needs.browser-changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the packed candidate
        run: |
          consumer="$RUNNER_TEMP/mqtt-consumer"
          mkdir -p "$RUNNER_TEMP/mqtt-artifact" "$consumer" "$RUNNER_TEMP/mqtt-broker"
          pnpm pack --pack-destination "$RUNNER_TEMP/mqtt-artifact"
          cp test/packed/*.mjs "$consumer/"
          printf '{"private":true,"type":"module"}\n' > "$consumer/package.json"
          npm install --prefix "$consumer" --engine-strict --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/mqtt-artifact/*.tgz "ws@$(node -p "require('./package.json').devDependencies.ws")"
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run the packed browser checks
        run: node test/packed/browser-build.mjs "$RUNNER_TEMP/mqtt-consumer" ${{ matrix.browser }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare packed native WebSocket in Node and Chromium
        if: matrix.browser == 'chromium'
        run: timeout 30 node test/packed/websocket-check.mjs "$RUNNER_TEMP/mqtt-consumer"
      - name: Run packed MQTT 5 sessions over WS and WSS in Chromium
        if: matrix.browser == 'chromium'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          timeout 180 bash test/packed/mosquitto-container.sh --pull
          MQTT_TEST_CHROMIUM=1 MOSQUITTO_BIN="$GITHUB_WORKSPACE/test/packed/mosquitto-container.sh" MQTT_BROKER_DIR="$RUNNER_TEMP/mqtt-broker" bash test/packed/mosquitto-ws.sh "$RUNNER_TEMP/mqtt-consumer"
      - name: Run the page lifecycle check
        run: |
          timeout 180 bash test/packed/mosquitto-container.sh --pull
          MOSQUITTO_BIN="$GITHUB_WORKSPACE/test/packed/mosquitto-container.sh" MQTT_BROKER_DIR="$RUNNER_TEMP/mqtt-broker" \
            bash test/packed/page-lifecycle.sh "$RUNNER_TEMP/mqtt-consumer" ${{ matrix.browser }} | tee -a "$GITHUB_STEP_SUMMARY"
